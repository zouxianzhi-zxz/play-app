name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:                          # 新增：两个参数，给总控传版本号
      lib_version:
        description: "用哪个 lib 版本（留空 = lib-version.txt）"
        required: false
      app_version:
        description: "网页上显示的 app 版本（留空 = 分支或 tag 名）"
        required: false
  repository_dispatch:
    types: [lib-released]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 决定版本
        env:
          INPUT_LIB: ${{ inputs.lib_version }}
          PAYLOAD_LIB: ${{ github.event.client_payload.lib_version }}
          INPUT_APP: ${{ inputs.app_version }}
        run: |
          # 优先级：按钮参数 > 消息里的版本 > lib-version.txt
          LIB_VERSION="${INPUT_LIB:-${PAYLOAD_LIB:-$(cat lib-version.txt)}}"
          APP_VERSION="${INPUT_APP:-$GITHUB_REF_NAME}"
          echo "lib=$LIB_VERSION app=$APP_VERSION"
          echo "LIB_VERSION=$LIB_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: 下载 play-lib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIB_VERSION" -R zouxianzhi-zxz/play-lib -p '*.zip'
          unzip play-lib-*.zip

      - name: 生成网页
        run: |
          mkdir site
          RESULT=$(python3 app.py)
          cat > site/index.html <<EOF
          <meta charset="utf-8">
          <h1>play-app $APP_VERSION</h1>
          <p>play-lib $LIB_VERSION</p>
          <p>触发方式：${{ github.event_name
          <p>运行结果：$RESULT</p>
          <p>部署时间：$(date -u)</p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
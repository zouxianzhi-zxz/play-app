name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  repository_dispatch:             # 新增：收到别的仓库发来的消息
    types: [lib-released]          # 只响应这个消息名

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 决定用哪个 lib 版本
        env:
          PAYLOAD_LIB: ${{ github.event.client_payload.lib_version }}   # 消息里带过来的版本
        run: |
          LIB_VERSION="${PAYLOAD_LIB:-$(cat lib-version.txt)}"   # 消息里有就用消息的，没有就用文件里的
          echo "使用 play-lib $LIB_VERSION"
          echo "LIB_VERSION=$LIB_VERSION" >> "$GITHUB_ENV"         # 让后面的 step 也能用这个变量

      - name: 下载 play-lib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$LIB_VERSION" -R zouxianzhi-zxz/play-lib -p '*.zip'
          unzip play-lib-*.zip

      - name: 生成网页
        run: |
          mkdir site
          RESULT=$(python3 app.py)
          cat > site/index.html <<EOF
          <meta charset="utf-8">
          <h1>play-app ${{ github.ref_name }}</h1>
          <p>play-lib $LIB_VERSION</p>
          <p>触发方式：${{ github.event_name }}</p>
          <p>运行结果：$RESULT</p>
          <p>部署时间：$(date -u)</p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4